name: Release

# Builds the native runtime and the assets, packages yukiosm and yukielevation for every platform, runs the integration
# tests on each platform and, for version tags, publishes a GitHub release and multi-architecture Docker images of both
# (yukiosm on Debian 12 and, without yukielevation, on Debian 11). The release also carries the images as one archive
# per architecture for offline installation with docker load.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version for a manual build (nothing is published)
        required: true
        default: 0.0.0-dev

permissions:
  contents: read

env:
  # Not named VERSION: MSBuild turns environment variables into properties, and a tag such as v1.0.0 is not a valid
  # package version.
  YUKIOSM_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  native:
    uses: ./.github/workflows/native.yml

  assets:
    name: Assets
    runs-on: ubuntu-24.04
    permissions:
      # Updates the external data fallback release.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # A prerelease that keeps the latest external data, because osmdata.openstreetmap.de is not always reachable.
      EXTERNAL_DATA_RELEASE: external-data
      EXTERNAL_DATA_DOWNLOADS: artifacts/cache/assets/external-data/downloads
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install the carto compiler
        working-directory: assets/carto-compiler
        run: npm ci --omit=dev

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: artifacts/cache/assets/downloads
          key: asset-downloads-${{ hashFiles('build/fetch-assets.ps1') }}

      # fetch-assets.ps1 only downloads newer archives than these and uses them if the server cannot be reached.
      - name: Restore the external data from the fallback release
        run: |
          mkdir -p "$EXTERNAL_DATA_DOWNLOADS" "$RUNNER_TEMP/external-data"
          if gh release download "$EXTERNAL_DATA_RELEASE" --dir "$EXTERNAL_DATA_DOWNLOADS" --clobber; then
            cp "$EXTERNAL_DATA_DOWNLOADS"/*.lastmod "$RUNNER_TEMP/external-data/"
          else
            echo "::warning::No release $EXTERNAL_DATA_RELEASE with external data to fall back to."
          fi

      # Includes the external data (water polygons etc.), the archives that get-external-data.py loads at import time.
      - name: Fetch assets
        shell: pwsh
        run: ./build/fetch-assets.ps1

      - name: Update the fallback release
        run: |
          gh release view "$EXTERNAL_DATA_RELEASE" > /dev/null || exit 0
          for lastmod in "$EXTERNAL_DATA_DOWNLOADS"/*.lastmod; do
            if ! cmp -s "$lastmod" "$RUNNER_TEMP/external-data/$(basename "$lastmod")"; then
              gh release upload "$EXTERNAL_DATA_RELEASE" "${lastmod%.lastmod}" "$lastmod" --clobber
            fi
          done

      - name: Archive
        run: tar -C artifacts -czf artifacts/assets.tar.gz assets

      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: artifacts/assets.tar.gz
          compression-level: 0
          if-no-files-found: error

  package:
    name: Package ${{ matrix.rid }}
    needs: [native, assets]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native-download

      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: artifacts

      - name: Extract
        run: |
          mkdir -p artifacts/native/${{ matrix.rid }}
          if [ -f artifacts/native-download/native-${{ matrix.rid }}.tar.gz ]; then
            tar -xzf artifacts/native-download/native-${{ matrix.rid }}.tar.gz -C artifacts/native/${{ matrix.rid }}
          else
            cp -r artifacts/native-download/. artifacts/native/${{ matrix.rid }}/
          fi
          tar -xzf artifacts/assets.tar.gz -C artifacts

      - name: Package
        shell: pwsh
        run: ./build/package.ps1 -Rid ${{ matrix.rid }} -Version "$($env:YUKIOSM_VERSION -replace '^v', '')"

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: |
            artifacts/bundle/*.zip
            artifacts/bundle/*.tar.gz
          compression-level: 0
          if-no-files-found: error

  integration:
    name: Integration tests ${{ matrix.rid }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/package

      - name: Extract the package
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/package -File | Select-Object -First 1
          New-Item -ItemType Directory -Force artifacts/installed | Out-Null
          if ($archive.Extension -eq '.zip') {
            Expand-Archive $archive.FullName artifacts/installed
          }
          else {
            tar -xzf $archive.FullName -C artifacts/installed
          }
          $installation = (Get-ChildItem artifacts/installed -Directory | Select-Object -First 1).FullName
          "YUKIOSM_HOME=$installation" >> $env:GITHUB_ENV

      - name: Download test data
        shell: bash
        run: |
          curl -fsSL --retry 5 -o testdata/beijing-latest.osm.pbf https://download.geofabrik.de/asia/china/beijing-latest.osm.pbf
          curl -fsSL --retry 5 -o testdata/tianjin-latest.osm.pbf https://download.geofabrik.de/asia/china/tianjin-latest.osm.pbf

      - name: Command line smoke test
        shell: pwsh
        run: |
          & (Join-Path $env:YUKIOSM_HOME 'yukiosm') render -i testdata/beijing-latest.osm.pbf -i testdata/tianjin-latest.osm.pbf `
            -z 12 --bbox 116.2,39.8,116.6,40.0 --data-dir artifacts/data -o artifacts/beijing.tif
          if ($LASTEXITCODE -ne 0) { throw "yukiosm render failed with exit code $LASTEXITCODE" }
          # Vector engine: builds the vector tiles with Planetiler and draws them with MapLibre Native and SwiftShader.
          & (Join-Path $env:YUKIOSM_HOME 'yukiosm') render --engine vector -i testdata/beijing-latest.osm.pbf -i testdata/tianjin-latest.osm.pbf `
            -z 12 --bbox 116.2,39.8,116.6,40.0 --data-dir artifacts/data -o artifacts/beijing-vector.tif
          if ($LASTEXITCODE -ne 0) { throw "yukiosm render --engine vector failed with exit code $LASTEXITCODE" }

      - name: Integration tests
        env:
          YUKIOSM_TEST_DATA_DIR: ${{ github.workspace }}/artifacts/data
        run: dotnet test YukiOsmRenderer.slnx --configuration Release --filter "TestCategory=Integration" --logger "console;verbosity=normal"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.rid }}
          path: |
            artifacts/beijing.tif
            artifacts/beijing-vector.tif
            artifacts/data/logs
            **/integration-output/*.tif
          if-no-files-found: ignore

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    # Published last, so that a failing Docker build does not leave a release without an image.
    needs: [package, integration, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The notes start at the previous version, not at the external data prerelease.
        run: |
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          gh release create "$GITHUB_REF_NAME" dist/* --title "YukiOsmRenderer $GITHUB_REF_NAME" --generate-notes \
            ${previous:+--notes-start-tag "$previous"} --verify-tag

  # Builds the image for every run so that problems show up before a release; it is only pushed for version tags.
  docker:
    name: Docker image
    needs: [package, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5

      # The archives, the two extracted bundles and the image layers need more space than the runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/download-artifact@v4
        with:
          pattern: package-linux-*
          path: dist
          merge-multiple: true

      - name: Prepare the build context
        run: |
          mkdir -p docker-context/bundle/amd64 docker-context/bundle/arm64
          tar -xzf dist/*-linux-x64.tar.gz -C docker-context/bundle/amd64 --strip-components=1
          tar -xzf dist/*-linux-arm64.tar.gz -C docker-context/bundle/arm64 --strip-components=1
          rm -rf dist
          cp Dockerfile docker-context/
          # yukielevation goes into the Debian 12 image only, and with its licenses into an image of its own.
          for arch in amd64 arm64; do
            mkdir -p "docker-context/elevation/$arch" "elevation-context/bundle/$arch/licenses"
            mv "docker-context/bundle/$arch/yukielevation" "docker-context/elevation/$arch/"
            cp "docker-context/elevation/$arch/yukielevation" "docker-context/bundle/$arch/"{LICENSE,THIRD-PARTY-NOTICES.md} \
              "elevation-context/bundle/$arch/"
            cp "docker-context/bundle/$arch/runtime/licenses/yukielevation/"* "elevation-context/bundle/$arch/licenses/"
          done
          cp src/YukiElevation/Dockerfile elevation-context/
          # Image names must be lowercase.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "ELEVATION_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yukielevation" >> "$GITHUB_ENV"
          df -h /

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Runs the amd64 images before publishing anything, so that missing system libraries (such as OpenSSL) fail the
      # release instead of the users' containers.
      - name: Smoke test (linux/amd64)
        run: |
          mkdir -p smoke
          curl -fsSL --retry 5 -o smoke/beijing.osm.pbf https://download.geofabrik.de/asia/china/beijing-latest.osm.pbf
          for debian in 12 11; do
            docker buildx build --platform linux/amd64 --load --build-arg "DEBIAN=$debian" -t yukiosm:smoke docker-context
            docker run --rm yukiosm:smoke --version
            docker run --rm --shm-size=1g -v "$PWD/smoke:/input:ro" yukiosm:smoke \
              render -i /input/beijing.osm.pbf -z 12 --bbox 116.3,39.85,116.45,39.95 > smoke/beijing.tif
            ls -l smoke/beijing.tif
            test "$(head -c 2 smoke/beijing.tif)" = "II"
            if [ "$debian" = 12 ]; then
              docker run --rm --entrypoint /opt/yukiosm/yukielevation yukiosm:smoke --version
            fi
            docker image rm yukiosm:smoke
          done
          rm -rf smoke

      - name: Smoke test of the elevation image (linux/amd64)
        run: |
          docker buildx build --platform linux/amd64 --load -t yukielevation:smoke elevation-context
          docker run --rm yukielevation:smoke --version
          # Without GeoTIFFs the service stops, but only after loading GDAL.
          mkdir -p empty
          docker run --rm -v "$PWD/empty:/data/gebco:ro" yukielevation:smoke > elevation-smoke.log 2>&1 || true
          cat elevation-smoke.log
          grep -q 'GDAL 3' elevation-smoke.log
          grep -q 'no GeoTIFFs' elevation-smoke.log
          docker image rm yukielevation:smoke
          rm -rf empty elevation-smoke.log

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The same image on Debian 11 (without yukielevation), tagged <version>-debian11 and debian11.
      - id: meta-debian11
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-debian11
            type=semver,pattern={{major}}.{{minor}},suffix=-debian11
            type=raw,value=debian11

      - uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          build-args: DEBIAN=11
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta-debian11.outputs.tags }}
          labels: ${{ steps.meta-debian11.outputs.labels }}

      - id: elevation-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ELEVATION_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: elevation-context
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.elevation-meta.outputs.tags }}
          labels: ${{ steps.elevation-meta.outputs.labels }}

      # One archive per architecture: docker load cannot load multi-platform archives into the classic image store, and
      # both together would exceed GitHub's 2 GiB limit for release assets. Unlike docker save with the runner's classic
      # image store (about 1.85 GiB), the exporter keeps the layers gzip-compressed (about 1.45 GiB).
      - name: Export image archives
        run: |
          version="${YUKIOSM_VERSION#v}"
          mkdir -p docker-dist
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" -t "$IMAGE:$version" \
              --output "type=docker,dest=docker-dist/yukiosm-$version-docker-$arch.tar" docker-context
            docker buildx build --platform "linux/$arch" --build-arg DEBIAN=11 -t "$IMAGE:$version-debian11" \
              --output "type=docker,dest=docker-dist/yukiosm-$version-docker-debian11-$arch.tar" docker-context
            docker buildx build --platform "linux/$arch" -t "$ELEVATION_IMAGE:$version" \
              --output "type=docker,dest=docker-dist/yukielevation-$version-docker-$arch.tar" elevation-context
          done
          ls -l docker-dist
          df -h /

      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: docker-images
          path: docker-dist/*.tar
          compression-level: 0
          if-no-files-found: error
