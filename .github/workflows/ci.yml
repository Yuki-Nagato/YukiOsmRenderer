name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['native/**', '**.md']
  pull_request:
    paths-ignore: ['native/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check formatting
        run: dotnet format YukiOsmRenderer.slnx --verify-no-changes

      - name: Build
        run: dotnet build YukiOsmRenderer.slnx --configuration Release

      - name: Unit tests
        run: dotnet test YukiOsmRenderer.slnx --configuration Release --no-build --filter "TestCategory!=Integration"
